# iOS build of the Bitwarden .NET MAUI (C#) app, scanned by Appknox
name: Appknox iOS Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL

permissions:
  contents: write
  pull-requests: write

env:
  RISK_THRESHOLD: CRITICAL
  APPKNOX_ACCESS_TOKEN: 12113443ec9b5c141adc459f9afec11830d709d4
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
  # fastlane needs a UTF-8 locale and shouldn't stop to check for updates
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  # Upstream used .NET 8.0.402 + Xcode 15.4, but macos-14 runners are retired.
  # The latest .NET 8 SDK/MAUI workload supports Xcode 16 on macos-15.
  DOTNET_VERSION: "8.0.4xx"
  XCODE_VERSION: "16.4"  # its iOS 18.5 simulator runtime is installed (actool needs one)
  DOTNET_PROJECT: src/App/App.csproj
  DOTNET_FRAMEWORK: net8.0-ios
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
jobs:
  build:
    # Intel image: same Xcode/simulators as macos-15, but arm64 runners are often out of capacity
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app
          xcodebuild -version
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workload
        run: |
          dotnet workload install maui
          dotnet workload list
      - name: Restore packages
        run: dotnet restore ${{ env.DOTNET_PROJECT }}
      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Unsigned build: enough for Appknox scanning, not for installing on a device.
      # The lane writes the IPA path to APP_PATH.
      - name: Build the app
        timeout-minutes: 60
        run: bundle exec fastlane ios build_unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-mobile.ipa
          path: ${{ env.APP_PATH }}
          if-no-files-found: error
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/knoxfixer
          path: appknox-go
      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .
      - name: Upload app and run Appknox cicheck
        id: appknox_scan
        continue-on-error: true
        run: |
          # The CLI prints some errors to stdout, so show the captured output on failure.
          if ! OUTPUT=$(./bin/appknox upload "$APP_PATH" --knoxiq); then
            echo "$OUTPUT"
            echo "::error::appknox upload failed"
            exit 1
          fi
          FILE_ID=$(printf '%s' "$OUTPUT" | tail -n 1 | tr -d '[:space:]')
          if ! [[ "$FILE_ID" =~ ^[0-9]+$ ]]; then
            echo "$OUTPUT"
            echo "::error::appknox upload did not return a numeric file ID"
            exit 1
          fi
          echo "Uploaded file id: $FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          ./bin/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
      - name: Run Appknox autofix
        if: steps.appknox_scan.outputs.file_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPKNOX=./bin/appknox
          FILE_ID="${{ steps.appknox_scan.outputs.file_id }}"
          $APPKNOX autofix --file-id "$FILE_ID"
      - name: Fail if cicheck found issues
        if: steps.appknox_scan.outcome == 'failure'
        run: exit 1
